name: Check Clerk docs links

on:
  # This check is required by the main ruleset, so it must report a result for every PR.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-docs-links:
    name: Check Clerk docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test link checker
        run: node --test .github/actions/check-docs-links/check-docs-links.test.mjs
      - uses: ./.github/actions/check-docs-links
