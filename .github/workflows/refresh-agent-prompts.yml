name: Refresh agent prompts

on:
  schedule:
    - cron: '41 9 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/refresh-agent-prompts.yml'
      - 'scripts/sync-agent-prompts.mjs'
      - 'skills/core/clerk-setup/references/setup.md'
      - 'skills/core/clerk-cli/references/setup.md'

jobs:
  guard-generated-files:
    if: github.event_name == 'pull_request' && github.head_ref != 'agent-prompts-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject hand edits to generated prompts
        run: |
          if ! git cat-file -e "${{ github.event.pull_request.base.sha }}:.github/workflows/refresh-agent-prompts.yml"; then
            echo 'Skipping the generated-file guard while the refresh workflow is being introduced.'
            exit 0
          fi

          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -Eq '^skills/core/(clerk-setup|clerk-cli)/references/setup\.md$'; then
            echo 'Setup instructions are generated from clerk/clerk. Edit clerk-docs/prompts/cli-setup.md instead.'
            exit 1
          fi

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          repository: clerk/clerk
          ref: main
          path: clerk-source
          token: ${{ secrets.CLERK_REPO_READ_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/sync-agent-prompts.mjs clerk-source
      - id: source
        working-directory: clerk-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CLERK_AUTOMATION_TOKEN }}
          branch: agent-prompts-refresh
          delete-branch: true
          commit-message: 'chore: refresh agent prompts'
          title: 'chore: refresh agent prompts'
          body: Generated from `clerk/clerk@${{ steps.source.outputs.sha }}`.
          add-paths: |
            skills/core/clerk-setup/references/setup.md
            skills/core/clerk-cli/references/setup.md
